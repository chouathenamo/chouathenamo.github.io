<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="{{ site.baseurl }}/" title="Home">
      {% include boat.svg %}
      <span>{{ site.title }}</span>
    </a>
    <nav class="site-nav">
      <a href="{{ site.baseurl }}/about/"          class="{% if page.url contains '/about' %}active{% endif %}">about</a>
      <a href="{{ site.baseurl }}/publications/"  class="{% if page.url contains '/publications' %}active{% endif %}">publications</a>
      <a href="{{ site.baseurl }}/presentations/" class="{% if page.url contains '/presentations' %}active{% endif %}">presentations</a>
      <a href="{{ site.baseurl }}/cv/"            class="{% if page.url contains '/cv' %}active{% endif %}">cv</a>
      <a href="{{ site.baseurl }}/misc/"          class="{% if page.url contains '/misc' %}active{% endif %}">misc</a>
      <button class="theme-toggle" type="button" aria-label="Toggle light/dark theme" title="Toggle theme">◐</button>
    </nav>
  </div>
</header>
