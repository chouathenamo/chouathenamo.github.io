<!DOCTYPE html>
<html lang="en-us">
  <head>
    {% include head.html %}
  </head>
  <body>
    {% include header.html %}

    <main class="content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <span>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</span>
        <span class="social-inline">
          <a href="{{ site.social.github }}" target="_blank" rel="noopener">github</a> ·
          <a href="{{ site.social.scholar }}" target="_blank" rel="noopener">scholar</a> ·
          <a href="mailto:{{ site.author.email }}">email</a>
        </span>
      </div>
    </footer>

    <script>
      // Theme toggle: remembers choice, defaults to system preference.
      // (The saved theme is already applied early in <head>.)
      (function () {
        var root = document.documentElement;
        var btn = document.querySelector('.theme-toggle');
        if (btn) btn.addEventListener('click', function () {
          var cur = root.getAttribute('data-theme');
          var sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
          var next = cur ? (cur === 'dark' ? 'light' : 'dark') : (sysDark ? 'light' : 'dark');
          root.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
        });
      })();
    </script>
  </body>
</html>
